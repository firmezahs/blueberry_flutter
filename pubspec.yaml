name: blueberry
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  #RestApi
  http: ^1.6.0
  html: ^0.15.6
  json_annotation: ^4.9.0

  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0

  webview_flutter: ^4.13.1

  #fonts
  google_fonts: ^8.0.0

  # utils
  nb_utils: ^7.2.0
  ag_widgets: ^1.1.7

  # State Management
  flutter_mobx: ^2.3.0
  mobx: ^2.6.0
  flutter_localization: ^0.3.3
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  mobx_codegen: ^2.7.6
#  dart run build_runner build --delete-conflicting-outputs

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

